  <!-- ===== 제품 이미지 갤러리 — 큰 사진을 좌우 지그재그로 보여줍니다 ===== -->
  <section class="home-gallery" aria-label="제품 이미지 갤러리">

    <div class="home-next-plan">

        <h2>NEXT PLAN</h2>
        <div class="home-next-plan-grid" id="home-next-plan" role="group" aria-label="브랜드의 다음 계획 이미지"></div>
      </div>
      <div class="home-next-plan-controls" aria-label="NEXT PLAN 탐색">
        <button type="button" data-next-plan-prev aria-label="이전 사진">‹</button>
        <span data-next-plan-page aria-live="polite">1 / 2</span>

  <!-- ===== 푸터 (5페이지 공통) [작성서 01: 푸터 표기 정보] ===== -->

    <p class="biz">
      상호: RE:STITCH · 대표자: 이지언<br />

    <p>© 브랜드 이름. All rights reserved.</p>

  <script src="script.js"></script>
  <script src="catalog.js"></script>
  <script>
    // 공개 제품 이미지만 사용해 첫 화면 4컷과 가로 스크롤 갤러리를 만듭니다.
    ProductCatalog.loadVisibleProducts()
      .then((products) => {
        const featured = products.filter((product) => product.featured);
        const imageProducts = (featured.length ? featured : products).filter((product) =>
          ProductCatalog.safeImageUrl(product.images && product.images[0])
        );

        if (!imageProducts.length) return;

        // 사진이 4장보다 적으면 앞의 사진을 반복해 항상 4칸을 채웁니다.
        const stripProducts = [];
        while (stripProducts.length < 4) {
          stripProducts.push(imageProducts[stripProducts.length % imageProducts.length]);
        }

        const imageLink = (product, className, showInfo = false) => {
          const image = ProductCatalog.safeImageUrl(product.images && product.images[0]);
          const label = ProductCatalog.escapeHtml(product.label || product.category || "");
          const name = ProductCatalog.escapeHtml(product.name || "제품");
          const info = showInfo
            ? '<div class="home-card-info"><p class="home-card-label">' + label + '</p>' +
              '<h3>' + name + '</h3></div>'
            : "";
          return (
            '<a class="' + className + '" href="product.html?id=' + encodeURIComponent(product.id) +
            '" aria-label="' + name + ' 상세 보기">' +
            '<span class="home-scroll-photo"><img src="' + ProductCatalog.escapeHtml(image) + '" alt="" draggable="false" onerror="this.closest(\'a\').remove()" /></span>' +
            info +
            '</a>'
          );
        };

        document.getElementById("home-next-plan").innerHTML = stripProducts
          .map((product) => {
            const image = ProductCatalog.safeImageUrl(product.images && product.images[0]);
            const name = ProductCatalog.escapeHtml(product.name || "제품");
            return (
              '<a class="home-next-plan-card" href="product.html?id=' + encodeURIComponent(product.id) + '" aria-label="' + name + ' 상세 보기">' +
              '<figure class="home-next-plan-frame">' +
              '<img src="' + ProductCatalog.escapeHtml(image) + '" alt="" loading="lazy" draggable="false" ' +
              'onerror="this.closest(\'a\').remove()" />' +
              '</figure>' +
              '</a>'
            );
          })
          .join("");

        const productScroll = document.getElementById("home-product-scroll");
        productScroll.innerHTML = imageProducts
          .map((product) => imageLink(product, "home-scroll-image", true))
          .join("");

        // BRAND BEST 사진은 화면에 들어올 때 자연스럽게 나타납니다.
        const revealItems = productScroll.querySelectorAll(".home-scroll-image");
        revealItems.forEach((item, index) => item.style.setProperty("--home-index", index));
        if ("IntersectionObserver" in window) {
          const revealObserver = new IntersectionObserver((entries, observer) => {
            entries.forEach((entry) => {
              if (!entry.isIntersecting) return;
              entry.target.classList.add("is-visible");
              observer.unobserve(entry.target);
            });
          }, { threshold: 0.18 });
          revealItems.forEach((item) => revealObserver.observe(item));
        } else {
          revealItems.forEach((item) => item.classList.add("is-visible"));
        }

        // NEXT PLAN은 스크롤바 없이 마우스로 잡아 이동할 수 있습니다.
        const nextPlanScroll = document.querySelector(".home-next-plan-scroll");
        const nextPlanPage = document.querySelector("[data-next-plan-page]");
        const previousButton = document.querySelector("[data-next-plan-prev]");
        const nextButton = document.querySelector("[data-next-plan-next]");
        const updateNextPlanPage = () => {
          const total = Math.max(1, Math.ceil(nextPlanScroll.scrollWidth / nextPlanScroll.clientWidth));
          const current = Math.min(total, Math.floor((nextPlanScroll.scrollLeft + nextPlanScroll.clientWidth * .35) / nextPlanScroll.clientWidth) + 1);
          nextPlanPage.textContent = current + " / " + total;
        };
        nextPlanScroll.addEventListener("scroll", updateNextPlanPage, { passive: true });
        previousButton.addEventListener("click", () => nextPlanScroll.scrollBy({ left: -nextPlanScroll.clientWidth, behavior: "smooth" }));
        nextButton.addEventListener("click", () => nextPlanScroll.scrollBy({ left: nextPlanScroll.clientWidth, behavior: "smooth" }));

        let isNextPlanDragging = false;
        let nextPlanDragMoved = false;
        let nextPlanDragStartX = 0;
        let nextPlanDragStartScroll = 0;
        nextPlanScroll.addEventListener("pointerdown", (event) => {
          if (event.pointerType !== "mouse" || event.button !== 0) return;
          isNextPlanDragging = true;
          nextPlanDragMoved = false;
          nextPlanDragStartX = event.clientX;
          nextPlanDragStartScroll = nextPlanScroll.scrollLeft;
          nextPlanScroll.classList.add("is-dragging");
          nextPlanScroll.setPointerCapture(event.pointerId);
        });
        nextPlanScroll.addEventListener("pointermove", (event) => {
          if (!isNextPlanDragging) return;
          const distance = nextPlanDragStartX - event.clientX;
          if (Math.abs(distance) > 4) nextPlanDragMoved = true;
          nextPlanScroll.scrollLeft = nextPlanDragStartScroll + distance;
        });
        const endNextPlanDrag = (event) => {
          if (!isNextPlanDragging) return;
          isNextPlanDragging = false;
          nextPlanScroll.classList.remove("is-dragging");
          if (nextPlanScroll.hasPointerCapture(event.pointerId)) nextPlanScroll.releasePointerCapture(event.pointerId);
          setTimeout(() => { nextPlanDragMoved = false; }, 0);
        };
        nextPlanScroll.addEventListener("pointerup", endNextPlanDrag);
        nextPlanScroll.addEventListener("pointercancel", endNextPlanDrag);
        nextPlanScroll.addEventListener("click", (event) => {
          if (!nextPlanDragMoved) return;
          event.preventDefault();
          event.stopPropagation();
        }, true);

        // NEXT PLAN 영역이 화면에 들어오면 제목부터 이미지 순서로 나타납니다.
        const nextPlanSection = document.querySelector(".home-next-plan");
        const nextPlanRevealItems = [
          nextPlanScroll.querySelector("h2"),
          ...nextPlanScroll.querySelectorAll(".home-next-plan-card")
        ].filter(Boolean);
        nextPlanRevealItems.forEach((item, index) => item.style.setProperty("--next-plan-index", index));
        const revealNextPlan = () => {
          if (nextPlanSection.classList.contains("is-visible")) return;
          nextPlanSection.classList.add("is-visible");
          nextPlanRevealItems.forEach((item) => item.classList.add("is-visible"));
        };
        if ("IntersectionObserver" in window) {
          const nextPlanObserver = new IntersectionObserver((entries, observer) => {
            entries.forEach((entry) => {
              if (!entry.isIntersecting) return;
              entry.target.classList.add("is-visible");
              observer.unobserve(entry.target);
            });
          }, { threshold: 0.08, rootMargin: "0px 0px -5%" });
          nextPlanRevealItems.forEach((item) => nextPlanObserver.observe(item));
          requestAnimationFrame(() => {
            nextPlanRevealItems.forEach((item) => {
              const box = item.getBoundingClientRect();
              if (box.top < window.innerHeight * .95 && box.bottom > 0) item.classList.add("is-visible");
            });
          });
        } else {
          nextPlanRevealItems.forEach((item) => item.classList.add("is-visible"));
        }
        updateNextPlanPage();
      })
      .catch(() => {});
  </script>
