  <!-- ===== 히어로 [작성서 04] 지정 대표 사진과 컬렉션 이동 버튼을 보여줍니다 ===== -->
  <section class="hero home-hero">
    <div class="home-hero-copy">
      <a href="products.html" class="btn">컬렉션 보기 <span aria-hidden="true">→</span></a>
    </div>
  </section>

  <!-- ===== 제품 이미지 갤러리 — 큰 사진을 좌우 지그재그로 보여줍니다 ===== -->
  <section class="home-gallery" aria-label="제품 이미지 갤러리">
    <div class="home-gallery-intro">
      <strong>HERITAGE / REIMAGINED</strong>
      <span class="home-gallery-rule" aria-hidden="true"></span>
      <p>Bespoke craftsmanship, reimagined for modern women</p>
    </div>
    <h2 class="home-best-title">BRAND BEST</h2>
    <div class="home-product-scroll" id="home-product-scroll"></div>
    <div class="home-next-plan">
      <h2>NEXT PLAN</h2>
      <div class="home-next-plan-grid" id="home-next-plan" role="group" aria-label="브랜드의 다음 계획 이미지"></div>
    </div>
  </section>

  <!-- ===== 푸터 (5페이지 공통) [작성서 01: 푸터 표기 정보] ===== -->
  <footer class="footer">
    <p class="logo footer-brand">RE:STITCH</p>
    <p class="footer-newsletter-copy">최신 정보와 이벤트 혜택을 이메일로 받아보세요.</p>
    <form class="footer-newsletter" action="mailto:hello@brand.com" method="post" enctype="text/plain">
      <label>
        <span class="visually-hidden">이메일 주소</span>
        <input type="email" name="email" placeholder="Email address" autocomplete="email" required />
      </label>
      <button type="submit">SUBSCRIBE</button>
    </form>
    <p class="biz">
      상호: RE:STITCH · 대표자: 이지언<br />
      사업자등록번호: 000-00-00000 · 주소: ○○○
    </p>
    <p>© 브랜드 이름. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
  <script src="catalog.js"></script>
  <script>
    // 공개 제품 이미지만 사용해 첫 화면 4컷과 가로 스크롤 갤러리를 만듭니다.
    ProductCatalog.loadVisibleProducts()
      .then((products) => {
        const featured = products.filter((product) => product.featured);
        const imageProducts = (featured.length ? featured : products).filter((product) =>
          ProductCatalog.safeImageUrl(product.images && product.images[0])
        );

        if (!imageProducts.length) return;

        // 사진이 4장보다 적으면 앞의 사진을 반복해 항상 4칸을 채웁니다.
        const stripProducts = [];
        while (stripProducts.length < 4) {
          stripProducts.push(imageProducts[stripProducts.length % imageProducts.length]);
        }

        const imageLink = (product, className, showInfo = false) => {
          const image = ProductCatalog.safeImageUrl(product.images && product.images[0]);
          const label = ProductCatalog.escapeHtml(product.label || product.category || "");
          const name = ProductCatalog.escapeHtml(product.name || "제품");
          const price = product.price
            ? '<p class="home-card-price">' + ProductCatalog.escapeHtml(product.price) + '</p>'
            : "";
          const info = showInfo
            ? '<div class="home-card-info"><p class="home-card-label">' + label + '</p>' +
              '<h3>' + name + '</h3>' + price + '</div>'
            : "";
          return (
            '<a class="' + className + '" href="product.html?id=' + encodeURIComponent(product.id) +
            '" aria-label="' + name + ' 상세 보기">' +
            '<img src="' + ProductCatalog.escapeHtml(image) + '" alt="" draggable="false" onerror="this.closest(\'a\').remove()" />' +
            info +
            '</a>'
          );
        };

        document.getElementById("home-next-plan").innerHTML = stripProducts
          .map((product) => {
            const image = ProductCatalog.safeImageUrl(product.images && product.images[0]);
            return (
              '<figure class="home-next-plan-frame">' +
              '<img src="' + ProductCatalog.escapeHtml(image) + '" alt="" loading="lazy" draggable="false" ' +
              'onerror="this.closest(\'figure\').remove()" />' +
              '</figure>'
            );
          })
          .join("");

        const productScroll = document.getElementById("home-product-scroll");
        productScroll.innerHTML = imageProducts
          .map((product) => imageLink(product, "home-scroll-image", true))
          .join("");
      })
      .catch(() => {});
  </script>
</body>
</html>
