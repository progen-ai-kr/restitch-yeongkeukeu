<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>상품 후기 작성 | RE:STITCH</title>
  <meta name="description" content="구매한 Re:Stitch 상품의 후기를 작성합니다." />
  <link rel="stylesheet" href="style.css?v=20260905-on-you-1" />
</head>
<body class="review-entry-page">
  <header class="nav">
    <div class="nav-inner">
      <a href="index.html" class="logo" aria-label="RE:STITCH 홈">RE:STITCH</a>
      <button class="nav-toggle" type="button" aria-label="메뉴 열기" aria-controls="site-menu" aria-expanded="false">☰</button>
      <nav class="nav-menu" id="site-menu"><a href="index.html">홈</a><a href="about.html">브랜드 소개</a><a href="products.html" class="active">제품</a><a href="portfolio.html">포트폴리오</a><a href="contact.html">서비스</a></nav>
      <div class="nav-actions" aria-label="빠른 메뉴">
        <button type="button" data-quick-action="search" aria-label="검색" title="검색"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg><span>검색</span></button>
        <button type="button" data-quick-action="wishlist" aria-label="관심상품" title="관심상품"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20.8 5.8a5.5 5.5 0 0 0-7.8 0L12 6.9l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 22l8.8-8.4a5.5 5.5 0 0 0 0-7.8Z"/></svg><span>관심상품</span></button>
        <button type="button" data-quick-action="login" aria-label="로그인" title="로그인"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></svg><span>로그인</span></button>
        <button type="button" data-quick-action="cart" aria-label="장바구니" title="장바구니"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 8h14l-1 13H6L5 8Z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/></svg><span>장바구니</span></button>
      </div>
    </div>
  </header>

  <main class="review-page product-review-page">
    <header class="review-page-head"><p class="eyebrow">PRODUCT REVIEW</p><h1>상품 후기 작성</h1><p>구매한 상품의 핏과 착용 경험을 알려주세요.</p></header>
    <form class="review-form" id="reviewForm">
      <div class="review-product-label">리뷰 제품<strong id="reviewProductName">제품을 확인하는 중입니다</strong></div>
      <label>착용 사진<input type="file" accept="image/jpeg,image/png"><span class="review-file-help">JPG, PNG · 최대 10MB</span></label>
      <div class="review-fields"><label>키 (cm)<input type="number" min="100" max="220" placeholder="예: 172"></label><label>몸무게 (kg)<input type="number" min="30" max="200" placeholder="예: 60"></label></div>
      <div class="review-fields"><label>구매 사이즈<select><option>선택</option><option>XS</option><option>S</option><option>M</option><option>L</option><option>XL</option><option>FREE</option></select></label><label>평점<select required><option value="">선택</option><option>★★★★★</option><option>★★★★☆</option><option>★★★☆☆</option><option>★★☆☆☆</option><option>★☆☆☆☆</option></select></label></div>
      <label>후기<textarea rows="5" maxlength="300" required placeholder="핏과 사이즈감, 착용 경험을 자유롭게 남겨주세요."></textarea></label>
      <label class="review-check"><input type="checkbox" required> 상품 상세페이지에 공개되는 후기임을 확인했습니다.</label>
      <button class="btn review-submit" type="submit">후기 등록하기</button>
      <p id="reviewStatus" class="review-status" aria-live="polite">후기 등록 기능은 준비 중입니다. 현재 입력 내용은 저장되지 않습니다.</p>
    </form>
  </main>

  <footer class="footer"><p class="logo footer-brand">RE:STITCH</p><p class="biz">상호: RE:STITCH · 대표자: 이지언</p><p>© RE:STITCH. All rights reserved.</p></footer>
  <script src="script.js"></script>
  <script>
    // 상품 상세페이지에서 전달한 id로 후기 대상 상품을 표시합니다.
    const productId = new URLSearchParams(location.search).get("product");
    const productName = document.getElementById("reviewProductName");
    if (productId) {
      fetch("products.json").then((response) => response.json()).then((payload) => {
        const items = Array.isArray(payload) ? payload : payload.products;
        const product = Array.isArray(items) ? items.find((item) => String(item.id) === productId) : null;
        productName.textContent = product ? product.name : "상품을 찾을 수 없습니다";
      }).catch(() => { productName.textContent = "상품 정보를 불러오지 못했습니다"; });
    } else {
      productName.textContent = "상품 상세페이지에서 후기를 작성해 주세요";
    }
    document.getElementById("reviewForm").addEventListener("submit", (event) => {
      event.preventDefault();
      document.getElementById("reviewStatus").textContent = "후기 등록 기능은 준비 중입니다. 입력 내용은 저장되지 않았습니다.";

    });
  </script>
</body>
</html>
