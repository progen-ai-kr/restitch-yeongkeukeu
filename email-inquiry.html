  <main class="email-inquiry-page">
    <header class="email-inquiry-page-head">
      <p class="eyebrow">CONTACT</p>
      <h1>이메일 문의하기</h1>
      <p>아래 양식을 작성해 주시면 담당자가 가능한 한 빠른 시일 내 연락드리겠습니다.</p>
    </header>

    <!-- 실제 전송 주소는 운영 이메일이 확정된 뒤 연결합니다. -->
    <form class="email-inquiry-form" data-email-inquiry-page-form>
      <fieldset>
        <legend>내 이메일 주소</legend>
        <label for="inquiry-email">이메일 주소 <span aria-hidden="true">*</span></label>
        <input id="inquiry-email" name="email" type="email" autocomplete="email" placeholder="example@gmail.com" required />
      </fieldset>

      <fieldset>
        <legend>내 프로필</legend>
        <label for="inquiry-gender">성별 <span aria-hidden="true">*</span></label>
        <select id="inquiry-gender" name="gender" required>
          <option value="">선택</option>
          <option value="female">여성</option>
          <option value="male">남성</option>
          <option value="none">선택하지 않음</option>
        </select>
        <div class="email-inquiry-columns">
          <label>성 <span aria-hidden="true">*</span><input name="lastName" type="text" autocomplete="family-name" required /></label>
          <label>이름 <span aria-hidden="true">*</span><input name="firstName" type="text" autocomplete="given-name" required /></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>내 요청</legend>
        <div class="email-inquiry-columns">
          <label>유형 <span aria-hidden="true">*</span>
            <select name="requestType" required>
              <option value="">선택</option>
              <option value="product">제품 문의</option>
              <option value="order">주문 및 배송</option>
              <option value="service">서비스 및 수선</option>
              <option value="other">기타</option>
            </select>
          </label>
          <label>목적 <span aria-hidden="true">*</span><input name="subject" type="text" required /></label>
        </div>
        <label>내용 <span aria-hidden="true">*</span>
          <textarea name="message" rows="8" placeholder="내용을 입력해 주세요." required></textarea>
        </label>
        <label class="email-file-label">파일 첨부하기
          <input name="attachment" type="file" accept=".jpg,.jpeg,.png,.pdf" />
        </label>
      </fieldset>

      <div class="email-inquiry-agreements">
        <label><input type="checkbox" required /> 사람입니다</label>
        <label><input type="checkbox" required /> 이용 약관에 동의합니다.</label>
        <label><input type="checkbox" required /> 개인정보 보호정책을 읽고 동의합니다.</label>
      </div>

      <button class="email-inquiry-submit" type="submit">전송하기</button>
      <p class="email-inquiry-status" aria-live="polite"></p>
    </form>
  </main>
