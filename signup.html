<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>계정 생성 | Re:Stitch</title>
  <meta name="description" content="Re:Stitch 회원 계정 생성" />
  <link rel="icon" href="images/favicon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <a href="index.html" class="logo" aria-label="RE:STITCH 홈">Re:Stitch</a>
      <button class="nav-toggle" aria-label="메뉴 열기">☰</button>
      <nav class="nav-menu">
        <a href="index.html">홈</a><a href="about.html">브랜드 소개</a><a href="products.html">제품</a><a href="portfolio.html">포트폴리오</a><a href="reviews.html">리뷰</a><a href="contact.html">서비스</a>
      </nav>
      <div class="nav-actions" aria-label="빠른 메뉴">
        <button type="button" data-quick-action="search" aria-label="검색" title="검색"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg><span>검색</span></button>
        <button type="button" data-quick-action="wishlist" aria-label="관심상품" title="관심상품"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20.8 5.8a5.5 5.5 0 0 0-7.8 0L12 6.9l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 22l8.8-8.4a5.5 5.5 0 0 0 0-7.8Z"/></svg><span>관심상품</span></button>
        <button type="button" data-quick-action="login" aria-label="로그인" title="로그인"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></svg><span>로그인</span></button>
        <button type="button" data-quick-action="cart" aria-label="장바구니" title="장바구니"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 8h14l-1 13H6L5 8Z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/></svg><span>장바구니</span></button>
      </div>
    </div>
  </header>

  <main class="auth-page auth-page-signup">
    <nav class="auth-switch" aria-label="회원 화면 전환">
      <a href="login.html">이미 등록하셨나요?</a>
      <a class="active" href="signup.html" aria-current="page">계정 생성하기</a>
    </nav>
    <section class="auth-card" aria-labelledby="signup-title">
      <p class="auth-eyebrow">JOIN RE:STITCH</p>
      <h1 id="signup-title">계정 생성하기</h1>
      <p class="auth-intro">계정 정보와 선호 정보를 입력해 주세요. 별표가 표시된 항목은 필수입니다.</p>
      <form class="auth-form" data-auth-form="signup">
        <fieldset class="auth-choice">
          <legend>성별<em>*</em></legend>
          <label><input type="radio" name="gender" value="male" required /> 남성</label>
          <label><input type="radio" name="gender" value="female" required /> 여성</label>
          <label><input type="radio" name="gender" value="other" required /> 선택 안 함</label>
        </fieldset>
        <div class="auth-field-grid">
          <label class="auth-field"><span>성(국문)<em>*</em></span><input name="lastName" autocomplete="family-name" required /></label>
          <label class="auth-field"><span>이름(국문)<em>*</em></span><input name="firstName" autocomplete="given-name" required /></label>
          <label class="auth-field"><span>성(영문)</span><input name="lastNameEnglish" autocomplete="family-name" /></label>
          <label class="auth-field"><span>이름(영문)</span><input name="firstNameEnglish" autocomplete="given-name" /></label>
        </div>
        <label class="auth-field"><span>생년월일<em>*</em></span><input name="birthdate" type="date" autocomplete="bday" required /></label>
        <label class="auth-field"><span>이메일<em>*</em></span><input name="email" type="email" autocomplete="email" required /></label>
        <label class="auth-field"><span>이메일 주소 확인<em>*</em></span><input name="emailConfirm" type="email" autocomplete="off" required /></label>
        <label class="auth-field"><span>비밀번호<em>*</em></span><span class="auth-password"><input name="password" type="password" minlength="8" autocomplete="new-password" required /><button type="button" data-password-toggle>보기</button></span><small>영문·숫자를 포함하여 8자 이상 입력해 주세요.</small></label>
        <label class="auth-field"><span>비밀번호 확인<em>*</em></span><span class="auth-password"><input name="passwordConfirm" type="password" minlength="8" autocomplete="new-password" required /><button type="button" data-password-toggle>보기</button></span></label>
        <label class="auth-field"><span>선호 언어</span><select name="language"><option value="ko">한국어</option><option value="en">English</option></select></label>
        <section class="auth-consents" aria-labelledby="consent-title">
          <h2 id="consent-title">약관 동의</h2>
          <label class="auth-check auth-check-all"><input type="checkbox" data-agree-all /> 모두 동의하기</label>
          <label class="auth-check"><input type="checkbox" name="terms" required data-required-consent /> <span><strong>필수</strong> 이용약관에 동의합니다.</span></label>
          <label class="auth-check"><input type="checkbox" name="privacy" required data-required-consent /> <span><strong>필수</strong> 개인정보 수집 및 이용에 동의합니다.</span></label>
          <label class="auth-check"><input type="checkbox" name="marketing" data-optional-consent /> <span><b>선택</b> 신상품 및 이벤트 소식 수신에 동의합니다.</span></label>
          <label class="auth-check"><input type="checkbox" name="age" required data-required-consent /> <span><strong>필수</strong> 만 14세 이상임을 확인합니다.</span></label>
        </section>
        <button class="auth-submit" type="submit">계정 생성하기</button>
        <p class="auth-status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
