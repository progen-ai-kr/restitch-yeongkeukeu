  <main class="review-page">
    <header class="review-page-head brand-banner"><p class="eyebrow">SNAP REVIEW</p><h1>착용 리뷰</h1><p>내 사이즈에 맞는 Re:Stitch 스타일을 공유해 주세요.</p></header>
    <section class="review-layout"><div class="review-snap-gallery"><div class="review-snap-placeholder">SNAP<br><span>YOUR STYLE</span></div><div class="review-snap-placeholder">RE:STITCH<br><span>ON YOU</span></div><div class="review-snap-placeholder">SHARE<br><span>THE FIT</span></div></div>
      <form class="review-form" id="reviewForm"><div class="review-product-label">리뷰 제품<strong id="reviewProductName">제품을 선택해 주세요</strong></div><label>스냅 사진<input type="file" accept="image/*"><span class="review-file-help">JPG, PNG · 최대 10MB</span></label><div class="review-fields"><label>키 (cm)<input type="number" placeholder="예: 172"></label><label>몸무게 (kg)<input type="number" placeholder="예: 60"></label></div><div class="review-fields"><label>구매 사이즈<select><option>선택</option><option>XS</option><option>S</option><option>M</option><option>L</option><option>XL</option><option>FREE</option></select></label><label>평점<select><option>선택</option><option>★★★★★</option><option>★★★★☆</option><option>★★★☆☆</option></select></label></div><label>한 줄 후기<textarea rows="4" maxlength="300" placeholder="핏과 사이즈감을 자유롭게 남겨주세요."></textarea><label class="review-check"><input type="checkbox" required> 다른 고객에게 공개되는 리뷰임을 확인했습니다.</label><button class="btn review-submit" type="submit">리뷰 등록하기</button><p id="reviewStatus" class="review-status" aria-live="polite"></p></form>
    </section>

  <script src="script.js"></script><script>
    const id=new URLSearchParams(location.search).get("product"); if(id) fetch("products.json").then(r=>r.json()).then(items=>{const p=items.find(x=>String(x.id)===id);if(p)document.getElementById("reviewProductName").textContent=p.name;}).catch(()=>{});
    document.getElementById("reviewForm").addEventListener("submit",e=>{e.preventDefault();document.getElementById("reviewStatus").textContent="리뷰가 등록되었습니다. 검토 후 공개됩니다.";e.currentTarget.reset();});
  </script>
