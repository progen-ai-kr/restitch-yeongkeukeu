<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 | Re:Stitch</title>
  <meta name="description" content="Re:Stitch 회원 로그인" />
  <link rel="icon" href="images/favicon.png" />
  <link rel="stylesheet" href="style.css?v=20260904-logo-font-1" />
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <a href="index.html" class="logo" aria-label="RE:STITCH HOME">RE:STITCH</a>
      <button class="nav-toggle" aria-label="OPEN MENU">☰</button>
      <nav class="nav-menu">
        <a href="index.html">HOME</a><a href="about.html">ABOUT</a><a href="products.html">SHOP</a><a href="portfolio.html">COLLECTION</a><a href="contact.html">SERVICE</a>
      </nav>
      <div class="nav-actions" aria-label="QUICK ACTIONS">
        <button type="button" data-quick-action="search" aria-label="SEARCH" title="SEARCH"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg><span>SEARCH</span></button>
        <button type="button" data-quick-action="wishlist" aria-label="WISHLIST" title="WISHLIST"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20.8 5.8a5.5 5.5 0 0 0-7.8 0L12 6.9l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 22l8.8-8.4a5.5 5.5 0 0 0 0-7.8Z"/></svg><span>WISHLIST</span></button>
        <button type="button" data-quick-action="login" aria-label="LOGIN" title="LOGIN"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></svg><span>LOGIN</span></button>
        <button type="button" data-quick-action="cart" aria-label="CART" title="CART"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 8h14l-1 13H6L5 8Z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/></svg><span>CART</span></button>
      </div>
    </div>
  </header>

  <main class="auth-page">
    <nav class="auth-switch" aria-label="회원 화면 전환">
      <a class="active" href="login.html" aria-current="page">이미 등록하셨나요?</a>
      <a href="signup.html">계정 생성하기</a>
    </nav>
    <section class="auth-card" aria-labelledby="login-title">
      <p class="auth-eyebrow">WELCOME BACK</p>
      <h1 id="login-title">Log in</h1>
      <p class="auth-intro">Re:Stitch 계정으로 로그인하여 관심상품과 주문 정보를 확인하세요.</p>
      <form class="auth-form" data-auth-form="login">
        <label class="auth-field"><span>이메일<em>*</em></span><input name="email" type="email" autocomplete="username" required /></label>
        <label class="auth-field"><span>비밀번호<em>*</em></span><span class="auth-password"><input name="password" type="password" autocomplete="current-password" required /><button type="button" data-password-toggle>보기</button></span></label>
        <div class="auth-form-row">
          <label class="auth-check"><input type="checkbox" name="remember" /> 로그인 상태 유지</label>
          <a href="#" data-auth-placeholder>비밀번호를 잊으셨나요?</a>
        </div>
        <button class="auth-submit" type="submit">로그인하기</button>
        <p class="auth-status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
